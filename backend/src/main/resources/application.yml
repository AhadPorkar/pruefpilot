spring:
  application:
    name: pruefpilot
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/pruefpilot}
    username: ${DATABASE_USER:pruefpilot}
    password: ${DATABASE_PASSWORD:}
    hikari:
      maximum-pool-size: 12
      connection-timeout: 10000
  flyway:
    enabled: ${MIGRATIONS_ENABLED:true}
    user: ${MIGRATION_USER:${DATABASE_USER:pruefpilot}}
    password: ${MIGRATION_PASSWORD:${DATABASE_PASSWORD:}}
  threads:
    virtual:
      enabled: true
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 11MB
  jackson:
    deserialization:
      fail-on-unknown-properties: true
server:
  port: 8080
  shutdown: graceful
  error:
    include-message: never
    include-stacktrace: never
  servlet:
    session:
      timeout: 30m
      cookie:
        name: PP_SESSION
        http-only: true
        secure: ${COOKIE_SECURE:false}
        same-site: strict
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
app:
  bootstrap-email: ${ADMIN_EMAIL:owner@example.test}
  bootstrap-password: ${ADMIN_PASSWORD:}
  organization: ${ORGANIZATION_NAME:PruefPilot Workspace}
  timezone: ${ORGANIZATION_TIMEZONE:Europe/Berlin}
  public-url: ${PUBLIC_URL:http://localhost:8080}
  demo: ${DEMO_DATA:false}
  demo-password: ${DEMO_PASSWORD:}
  production: ${PRODUCTION:false}
  max-evidence-bytes: 10485760
logging:
  level:
    root: INFO
    org.springframework.security: WARN
